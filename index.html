<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/db-logo-icon.png" />
    <link rel="apple-touch-icon" href="/db-logo-icon.png" />
    <!-- First thing the preloader shows: fetch it with the HTML, not after the JS boots. -->
    <link rel="preload" as="image" type="image/webp" href="/db-logo-mark.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Dark canvas from the very first paint, before any stylesheet (or the
         JS that renders the preloader) has downloaded -- no white flash. -->
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body {
        background: #000;
      }
      /* Cold-load shell (see #boot-shell below): its logo stays dark for
         the first 500ms -- a normal load mounts the real preloader before
         then -- and only on a slow load plays the preloader's own logo
         entrance (same 700ms fade / scale / blur and easing) while the JS
         is still downloading. */
      #boot-shell-logo {
        opacity: 0;
        transform: scale(0.96);
        filter: blur(10px);
        animation: boot-logo-in 700ms cubic-bezier(0.16, 1, 0.3, 1) 500ms forwards;
      }
      @keyframes boot-logo-in {
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-shell-logo {
          animation: none;
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
    </style>

    <title>Bhatti Divyaraj — Web Developer, Software Developer &amp; Graphic Designer</title>
    <meta
      name="description"
      content="Portfolio of Bhatti Divyaraj, a Web Developer, Software Developer & Graphic Designer specializing in responsive websites, custom CRM and web-based software, WordPress, Shopify, UI/UX and graphic design."
    />
    <meta name="keywords" content="Bhatti Divyaraj, Web Developer, Software Developer, CRM Development, Graphic Designer, WordPress Developer, Shopify Developer, UI/UX Design, Rajkot, Gujarat, Portfolio" />
    <meta name="author" content="Bhatti Divyaraj" />
    <link rel="canonical" href="https://ds-portfolio-seven-sigma.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bhatti Divyaraj — Web Developer, Software Developer & Graphic Designer" />
    <meta
      property="og:description"
      content="Portfolio of Bhatti Divyaraj, a Web Developer, Software Developer & Graphic Designer specializing in responsive websites, custom CRM and web-based software, WordPress, Shopify, UI/UX and graphic design."
    />
    <meta property="og:url" content="https://ds-portfolio-seven-sigma.vercel.app/" />
    <meta property="og:image" content="https://ds-portfolio-seven-sigma.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bhatti Divyaraj — Web Developer, Software Developer & Graphic Designer" />
    <meta property="og:site_name" content="Bhatti Divyaraj" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bhatti Divyaraj — Web Developer, Software Developer & Graphic Designer" />
    <meta name="twitter:image" content="https://ds-portfolio-seven-sigma.vercel.app/og-image.jpg" />
    <meta
      name="twitter:description"
      content="Portfolio of Bhatti Divyaraj, a Web Developer, Software Developer & Graphic Designer specializing in responsive websites, custom CRM and web-based software, WordPress, Shopify, UI/UX and graphic design."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@300;700;800&family=Albert+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Static first frame of the preloader, shown while the JS downloads.
         Same markup/classes as Preloader.tsx's composition so the logo sits
         at the identical position (the name/role/line are invisible here
         but keep their space). Preloader.tsx removes it on mount, before
         its first paint, and continues the logo from wherever this left
         off -- keep the two in sync if the preloader layout changes. -->
    <div id="boot-shell" class="fixed inset-0 z-[999] overflow-hidden bg-black" aria-hidden="true">
      <div class="flex h-full w-full flex-col items-center justify-center px-6">
        <div id="boot-shell-logo" class="h-16 w-16 sm:h-20 sm:w-20 md:h-16 md:w-16 lg:h-20 lg:w-20 xl:h-24 xl:w-24">
          <img src="/db-logo-mark.webp" alt="" class="h-full w-full object-contain" draggable="false" />
        </div>
        <p class="invisible mt-7 select-none whitespace-nowrap font-display text-xl font-semibold uppercase tracking-[0.08em] sm:text-2xl">
          DIVYARAJ
        </p>
        <p class="invisible mt-3 max-w-[16rem] text-center text-[9px] uppercase leading-relaxed tracking-[0.35em] sm:max-w-none sm:whitespace-nowrap sm:text-[10px]">
          Web Developer / Software Developer / Graphic Designer
        </p>
        <span class="invisible mt-8 h-px w-14 sm:w-16"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
